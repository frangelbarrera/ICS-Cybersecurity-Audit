name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync root docs to site
        run: |
          cp README.md docs/index.md
          cp tools/README.md docs/tools.md
          # Fix paths: root README references docs/images/ but MkDocs uses images/
          sed -i 's|docs/images/|images/|g' docs/index.md
          # Fix relative links from tools/README.md that don't work inside docs/
          sed -i 's|](../../README.md)|](index.md)|g' docs/tools.md
          sed -i 's|](../../CONTRIBUTING.md)|](https://github.com/frangelbarrera/ICS-Cybersecurity-Audit/blob/main/CONTRIBUTING.md)|g' docs/tools.md

      - name: Build site
        run: mkdocs build --strict

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
